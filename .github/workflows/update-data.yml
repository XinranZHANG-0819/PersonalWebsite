name: 更新行情数据
on:
  schedule:
    - cron: '30 8 * * 1-5'   # 北京时间工作日 16:30（A 股收盘后）
    - cron: '30 21 * * 1-5'  # 北京时间 05:30（美股收盘后）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-data.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 抓取 PB 分位（失败不影响其他数据）
        continue-on-error: true
        run: |
          pip install akshare pandas
          python scripts/fetch_pb.py
      - name: 提交有变化的数据
        run: |
          if [ -n "$(git status --porcelain src/data)" ]; then
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git add src/data
            git commit -m "chore: 更新行情数据"
            git push
          fi
